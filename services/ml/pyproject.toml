[project]
name = "smarthelix-ml"
version = "0.1.0"
description = "Role 2 ML functions: preprocessing, similarity, matchmaking, clustering, LSH benchmark"
requires-python = ">=3.11,<3.12"
dependencies = ["pyspark[ml]==3.5.1"]  # the ml extra brings numpy, which pyspark.ml imports

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smarthelix_ml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

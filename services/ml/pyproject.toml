[project]
name = "smarthelix-ml"
version = "0.1.0"
description = "Role 2 ML functions: preprocessing, similarity, matchmaking, clustering, LSH benchmark"
requires-python = ">=3.11,<3.12"
# pyspark[ml] brings numpy; PySpark 3.5 predates numpy 2 (it calls np.in1d and np.string_, both removed there).
dependencies = ["pyspark[ml]==3.5.1", "numpy>=1.22,<2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smarthelix_ml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project]
name = "pipeline"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2.10,<3", "pyspark==3.5.1"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

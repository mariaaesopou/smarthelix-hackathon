name: smarthelix

x-db-url: &db-url postgres://${POSTGRES_USER:-smarthelix}:${POSTGRES_PASSWORD:-smarthelix_dev}@postgres:5432/${POSTGRES_DB:-smarthelix}?sslmode=disable

# Health check for the Node services: GET <url> must answer 2xx.
x-node-health: &node-health
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 10s

services:
  postgres:
    image: postgres:17.12
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smarthelix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarthelix_dev}
      POSTGRES_DB: ${POSTGRES_DB:-smarthelix}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/seeds:/seeds:ro
      - ./db/tests:/dbtests:ro
    healthcheck:
      # -h forces TCP: the temporary init server only listens on the socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  migrate:
    image: ghcr.io/amacneil/dbmate:2.26.0
    command: ["--no-dump-schema", "up"]
    environment:
      DATABASE_URL: *db-url
      DBMATE_MIGRATIONS_DIR: /db/migrations
    volumes: ["./db/migrations:/db/migrations:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., args: { APP_DIR: apps/api } }
    restart: unless-stopped
    environment:
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379
      PROFILES_SOURCE: ${PROFILES_SOURCE:-database}
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., args: { APP_DIR: apps/worker } }
    restart: unless-stopped
    environment:
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379
      MOCK_SOURCES_URL: http://mock-sources:4000
      ERASURE_HMAC_SECRET: ${ERASURE_HMAC_SECRET:-}
    # Snapshots, models and benchmark data; data/ is git-ignored.
    volumes: ["./data:/repo/data"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mock-sources: { condition: service_healthy }

  web:
    build: { context: ., args: { APP_DIR: apps/web } }
    restart: unless-stopped
    environment:
      # File events do not reach containers from Windows or macOS hosts.
      VITE_WATCH_POLLING: "true"
    # Source mounted for hot reload; dependencies stay in the image.
    volumes:
      - ./apps/web/src:/repo/apps/web/src
      - ./apps/web/index.html:/repo/apps/web/index.html
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      api: { condition: service_healthy }

  mock-sources:
    build: { context: ., args: { APP_DIR: services/mock-sources } }
    restart: unless-stopped
    ports: ["127.0.0.1:4000:4000"]
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]

  # pnpm generate:py. Not started by `docker compose up`.
  codegen-py:
    profiles: [tools]
    image: python:3.11-slim
    working_dir: /repo
    volumes: [".:/repo"]
    command:
      - sh
      - -c
      - >-
        pip install -q --root-user-action=ignore datamodel-code-generator==0.102.0 &&
        datamodel-codegen --input packages/shared/schemas --input-file-type jsonschema
        --output services/pipeline/src/pipeline/generated
        --output-model-type pydantic_v2.BaseModel
        --target-python-version 3.11 --disable-timestamp

  # Pipeline commands without a local Python: pnpm etl:a, pnpm test:pipeline.
  # Not started by `docker compose up`. Installs only what the connectors need;
  # PySpark joins the worker image on Day 5.
  pipeline:
    profiles: [tools]
    image: python:3.11-slim-bookworm
    working_dir: /repo/services/pipeline
    volumes: [".:/repo", "pipcache:/root/.cache/pip"]
    environment:
      DATABASE_URL: *db-url
      MOCK_SOURCES_URL: http://mock-sources:4000
      ERASURE_HMAC_SECRET: ${ERASURE_HMAC_SECRET:-}
      PYTHONPATH: /repo/services/pipeline/src
      PYTHONDONTWRITEBYTECODE: "1"
    entrypoint:
      - sh
      - -c
      - >-
        pip install -q --root-user-action=ignore --disable-pip-version-check
        "pydantic>=2.10,<3" "psycopg[binary]>=3.2,<4" "pytest>=8" && exec "$$@"
      - pipeline
    depends_on:
      migrate: { condition: service_completed_successfully }
      mock-sources: { condition: service_healthy }

volumes:
  pgdata:
  pipcache:
